#
# SOCFortress CoPilot state/backup include patterns for Restic
# Syntax reference: https://pkg.go.dev/path/filepath#Glob
# Restic --files-from: https://restic.readthedocs.io/en/stable/040_backup.html#including-files
#
# The database is saved as the copilot.sql dump (bin/module-dump-state),
# not as the mysql-data volume. copilot.env and smarthost.env are written
# again by configure-module and at start; the frontend certificate, the
# logs and the Nuclei templates are created again.
#
state/copilot.sql
state/mysql.env
state/minio.env
state/secrets.env
state/custom.env
volumes/copilot-data
volumes/minio-data
volumes/nuclei-reports
